# https://hub.docker.com/_/postgres/?tag=18.6-trixie

secrets:
  postgres-18-password:
    external: true

services:

  db:
    image: postgres
    restart: unless-stopped
    # # set shared memory limit when using docker compose
    # shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    volumes:
     - type: tmpfs
       target: /dev/shm
       tmpfs:
         size: 134217728 # 128*2^20 bytes = 128Mb
     - type: volume
       target: /var/lib/postgresql
    secrets:
      - postgres-18-password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-18-password
      POSTGRES_USER: postgres
      POSTGRES_DB: americanalsa_dev
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5432:5432"

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 8080:8080

